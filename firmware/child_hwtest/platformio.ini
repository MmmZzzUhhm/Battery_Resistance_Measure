; 子機基板 動作確認用チェックアプリ (本番ファームウェアとは完全に独立したプロジェクト)
; 用途: 新規起版した子機基板(XIAO ESP32C6 + IWS7817 + PCF8563T)の実装検査。
; 使い方: pio run -t upload && pio device monitor でシリアルログを確認する。
[platformio]
build_dir = C:/pio_build/xiao_child_hwtest

[env:seeed_xiao_esp32c6]
; "stable" tag currently resolves to 55.03.311, whose toolchain-riscv32-esp ships picolibc-only headers
; (missing stdint.h/stdlib.h in the default newlib include path) without the build script enabling picolibc mode.
; Pinned to the prior release to avoid that regression.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; 既定パーティションはアプリ領域が小さすぎるため拡大 (本番子機ファームウェアと同じ)
board_build.partitions = min_spiffs.csv

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; 実機配線に合わせて変更可 (本番ファームウェアと同じ既定値)
    -D PIN_I2C_SDA=22
    -D PIN_I2C_SCL=23
    -D IWS7817_I2C_ADDR=0x03

lib_deps =
    adafruit/RTClib@^2.1.4
