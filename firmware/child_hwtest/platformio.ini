; 子機基板 動作確認用チェックアプリ (本番ファームウェアとは完全に独立したプロジェクト)
; 用途: 新規起版した子機基板(XIAO ESP32C6 + IWS7817 + PCF8563T)の実装検査。
; 使い方: pio run -t upload && pio device monitor でシリアルログを確認する。
[platformio]
build_dir = C:/pio_build/xiao_child_hwtest

[env:seeed_xiao_esp32c6]
; "stable" tag currently resolves to 55.03.311, whose toolchain-riscv32-esp ships picolibc-only headers
; (missing stdint.h/stdlib.h in the default newlib include path) without the build script enabling picolibc mode.
; Pinned to the prior release to avoid that regression.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; 既定パーティションはアプリ領域が小さすぎるため拡大 (本番子機ファームウェアと同じ)
board_build.partitions = min_spiffs.csv

; NOTE: crosstool-NG esp-14.2.0_20251208以降のriscv32ツールチェインはPicolibcへの移行が
; 進んでおり (esp-14.2.0_20260121で"Add full Picolibc support")、newlib用の標準ヘッダ
; (stdint.h/stdlib.h等)がriscv32-esp-elf/includeに存在せずpicolibc/includeにしか無い。
; framework=arduinoのビルドスクリプトはまだこれに未対応でコンパイルエラーになるため、
; Picolibc移行前の安定版に個別ピン止めする。platform自体をZIPで固定してもツールチェインは
; pioarduino registryから都度最新が取得されるため、この指定がないと再発する。
platform_packages =
    toolchain-riscv32-esp @ https://github.com/pioarduino/registry/releases/download/0.0.1/riscv32-esp-elf-14.2.0_20251107.zip

; 上記platform_packages指定時、pio run毎にtoolchain-riscv32-espのpackages/への
; 再配置がエラーを出さずに失敗する不具合があるため、コンパイル前に自動復旧させる。
extra_scripts = pre:fix_toolchain.py

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; 実機配線に合わせて変更可 (本番ファームウェアと同じ既定値)
    -D PIN_I2C_SDA=22
    -D PIN_I2C_SCL=23
    -D IWS7817_I2C_ADDR=0x03
    ; IWS7817電源制御ピン (D3=I2C_Power_CTRL、TPS22917負荷スイッチのON制御)
    -D PIN_IWS7817_PWR=21

lib_deps =
    adafruit/RTClib@^2.1.4
