; 基板 動作確認用チェックアプリ (本番ファームウェアとは完全に独立したプロジェクト)
; 用途: 1枚のXIAO ESP32S3基板を実装違いで複数用途に使う新規基板の実装検査。
;   起動時にシリアルモニタで構成番号(1-4)を入力して検査対象を切り替える:
;     1: 親機                     (SD_MMC 1bit + SHT31 + PCF8563T)
;     2: 超音波センサ              (SPH0641LU4H-1 PDMマイクのみ)
;     3: マイクロ波ドップラーセンサカメラ (IMD-2000 + SD_MMC 1bit + PCF8563T)
;     4: 薄型カウンタカメラ        (XIAO ESP32S3 Sense内蔵カメラ + SD_MMC 1bit)
; 使い方: pio run -t upload && pio device monitor でシリアルログを確認。
; 検査後、自身が立てるAP "HWTEST-xxx" (パスワード hwtest1234) に接続し
; http://192.168.4.1/ で結果ページも確認できる。
[platformio]
build_dir = C:/pio_build/xiao_parent_hwtest

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    ; 実機配線に合わせて変更可 (本番ファームウェアと同じ既定値)
    ; I2C: 親機(SHT31/PCF8563T) / ドップラー(PCF8563T) / 薄型カウンタカメラ(ADG728 addr 0x4C, 照明明るさ制御) 共用
    -D PIN_I2C_SDA=5
    -D PIN_I2C_SCL=6
    ; SD_MMC(1bit): 親機 / ドップラー / 薄型カウンタカメラ 共用
    -D PIN_SD_CLK=2
    -D PIN_SD_CMD=3
    -D PIN_SD_D0=1
    ; SHT31 I2Cアドレス: 親機のみ
    -D SHT31_I2C_ADDR=0x44
    ; IMD-2000 UART配線 (D6/D7): ドップラーのみ
    -D PIN_IMD2000_TX=44
    -D PIN_IMD2000_RX=43
    ; SPH0641LU4H-1 PDM配線 (D0/D1): 超音波センサのみ
    -D PIN_PDM_CLK=2
    -D PIN_PDM_DATA=1
    -D PDM_SAMPLE_RATE_HZ=48000

lib_deps =
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit SHT31 Library@^2.2.2
