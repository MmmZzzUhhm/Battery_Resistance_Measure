; 子機ファームウェア: XIAO ESP32C6 + IWS7817 + PCF8563T
; 詳細: docs/protocol.md, ../../.claude 配下の設計計画を参照
;
; NOTE: 公式 platformio/platform-espressif32 は Arduino core 2.0.17 で停滞しているため、
; ESP32-C6のBLE(NimBLEベース)を安定動作させるべく pioarduino フォーク(core 3.3.x)を使用する。
;
; NOTE: このプロジェクトはパス中に日本語+空白 ("XIAO_Battery_Internal Resistance" 配下に
; "マイドライブ" を含む)を含むため、リンカ(ld.exe)がmapファイルを開けず失敗する既知の問題がある。
; ビルド出力をASCIIのみの一時ディレクトリへリダイレクトして回避する。
[platformio]
build_dir = C:/pio_build/xiao_child

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; OTA用に大きいアプリ領域を確保するパーティションスキーム (SPIFFS未使用のため縮小)
board_build.partitions = min_spiffs.csv

; protocol.h は firmware/common/include/protocol.h の複製を include/ に配置している
; (Windows上の一部ツールチェインが日本語+空白混じりパスへの -I 参照を解決できないため)
build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; IWS7817 I2C配線ピン (実機配線に合わせて変更可)
    -D PIN_I2C_SDA=22
    -D PIN_I2C_SCL=23

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/RTClib@^2.1.4
