; 子機ファームウェア: XIAO ESP32C6 + IWS7817 + PCF8563T
; 詳細: docs/protocol.md, ../../.claude 配下の設計計画を参照
;
; NOTE: 公式 platformio/platform-espressif32 は Arduino core 2.0.17 で停滞しているため、
; ESP32-C6のBLE(NimBLEベース)を安定動作させるべく pioarduino フォーク(core 3.3.x)を使用する。
;
; NOTE: このプロジェクトはパス中に日本語+空白 ("XIAO_Battery_Internal Resistance" 配下に
; "マイドライブ" を含む)を含むため、リンカ(ld.exe)がmapファイルを開けず失敗する既知の問題がある。
; ビルド出力をASCIIのみの一時ディレクトリへリダイレクトして回避する。
[platformio]
build_dir = C:/pio_build/xiao_child

[env:seeed_xiao_esp32c6]
; "stable"タグ(浮動)はfirmware/child_hwtestと異なるバージョンに解決されることがあり、
; 同じ~/.platformioを共有する2プロジェクトを行き来するたびにframework/toolchainパッケージの
; 上書き・再ダウンロードが発生していた。child_hwtestと同一バージョンに固定して回避する。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; OTA用に大きいアプリ領域を確保するパーティションスキーム (SPIFFS未使用のため縮小)
board_build.partitions = min_spiffs.csv

; NOTE: crosstool-NG esp-14.2.0_20251208以降のriscv32ツールチェインはPicolibcへの移行が
; 進んでおり (esp-14.2.0_20260121で"Add full Picolibc support")、newlib用の標準ヘッダ
; (stdint.h/stdlib.h等)がriscv32-esp-elf/includeに存在せずpicolibc/includeにしか無い。
; framework=arduinoのビルドスクリプトはまだこれに未対応でコンパイルエラーになるため、
; Picolibc移行前の安定版に個別ピン止めする。platform自体をZIPで固定してもツールチェインは
; pioarduino registryから都度最新が取得されるため、この指定がないと再発する。
platform_packages =
    toolchain-riscv32-esp @ https://github.com/pioarduino/registry/releases/download/0.0.1/riscv32-esp-elf-14.2.0_20251107.zip

; 上記platform_packages指定時、pio run毎にtoolchain-riscv32-espのpackages/への
; 再配置がエラーを出さずに失敗する不具合があるため、コンパイル前に自動復旧させる。
extra_scripts = pre:fix_toolchain.py

; protocol.h は firmware/common/include/protocol.h の複製を include/ に配置している
; (Windows上の一部ツールチェインが日本語+空白混じりパスへの -I 参照を解決できないため)
build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; IWS7817 I2C配線ピン (実機配線に合わせて変更可)
    -D PIN_I2C_SDA=22
    -D PIN_I2C_SCL=23
    ; IWS7817電源制御ピン (D3=I2C_Power_CTRL、TPS22917負荷スイッチのON制御)
    -D PIN_IWS7817_PWR=21

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/RTClib@^2.1.4
