; 薄型カウンタカメラ ファームウェア: XIAO ESP32S3 Sense (内蔵カメラ) + microSD(SD_MMC 1bit) + PCF8563T(RTC)
; 機能: 上位システム(予兆監視システム)からONVIF(簡易実装、WS-Discovery/認証/PTZ/動画配信なし)
;       で撮影要求を受け付け、SDに保存後cfg.portal_base_urlへアップロードする。
;       照明制御はONVIF標準外の簡易HTTPエンドポイント(/onvif/light/on|off)。詳細: src/onvif_*.cpp
;
; NOTE: 公式 platformio/platform-espressif32 は Arduino core 2.0.17 で停滞しているため、
; pioarduino フォーク(core 3.3.x)を使用する (parent/childと揃える)。
;
; NOTE: プロジェクトパスに日本語+空白を含むため、リンカ(ld.exe)がmapファイルを開けず
; 失敗する既知の問題がある。ビルド出力をASCIIのみの一時ディレクトリへリダイレクトする。
[platformio]
build_dir = C:/pio_build/xiao_counter_camera

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    ; XIAO ESP32S3 Sense内蔵カメラの固定配線ピン (Sense拡張ボード固有のため変更不要)
    ; microSD SD_MMC 1bitモード配線ピン (新規基板の実測値。parent_hwtestで動作確認済み。実機配線に合わせて変更可)
    -D PIN_SD_CLK=2
    -D PIN_SD_CMD=3
    -D PIN_SD_D0=1
    ; PCF8563T(RTC) / ADG728(照明明るさ制御) I2C配線ピン (親機と同じ既定値。実機配線に合わせて変更可)
    -D PIN_I2C_SDA=5
    -D PIN_I2C_SCL=6
    ; 照明制御: ADG728(I2Cアナログデータセレクタ, 既定addr 0x4C)がLED1/LED2の電流制限抵抗を
    ; 切り替えて明るさを調整する (light_control.cpp参照)。GPIO直結ではないためピン設定は不要。

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/RTClib@^2.1.4
