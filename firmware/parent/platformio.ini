; 親機ファームウェア: XIAO ESP32S3 + PCF8563T + microSD(SD_MMC 1bit)
; 詳細: docs/protocol.md
;
; NOTE: 公式 platformio/platform-espressif32 は Arduino core 2.0.17 で停滞しているため、
; pioarduino フォーク(core 3.3.x)を使用する (子機と揃える)。
;
; NOTE: プロジェクトパスに日本語+空白を含むため、リンカ(ld.exe)がmapファイルを開けず
; 失敗する既知の問題がある。ビルド出力をASCIIのみの一時ディレクトリへリダイレクトする。
[platformio]
build_dir = C:/pio_build/xiao_parent

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; RTC(PCF8563T) I2C配線ピン (実機配線に合わせて変更可)
    -D PIN_I2C_SDA=5
    -D PIN_I2C_SCL=6
    ; microSD SD_MMC 1bitモード配線ピン (XIAO ESP32S3 Sense拡張ボード想定値、実機配線に合わせて変更可)
    -D PIN_SD_CLK=7
    -D PIN_SD_CMD=9
    -D PIN_SD_D0=8

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/RTClib@^2.1.4
